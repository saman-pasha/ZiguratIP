# ---------------------------------------------------------------------------
# ZiguratIP server configuration
#
# Every setting the server reads is listed here with its default. Indentation
# is the nesting, "#" starts a comment, and a commented-out path falls back to
# a location derived from ZIGURATIP_HOME.
#
# The values below are what the demo and the tutorials expect. Start with:
#
#     export ZIGURATIP_HOME=/path/to/ZiguratIP/home
#     $ZIGURATIP_HOME/bin/ziguratip
# ---------------------------------------------------------------------------

LOCALE: en_US.utf8          # any name from "locale -a"

# All three default to ZIGURATIP_HOME, then to ~/ZiguratIP. Set them only to
# put the data somewhere other than the install directory.
#HOME_PATH:    /path/to/ZiguratIP/home
#CATALOG_PATH: /path/to/ZiguratIP/home/catalog
#LIBRARY_PATH: /path/to/ZiguratIP/home/ld

# FALSE keeps your data between restarts, and the store is created on first
# run. Set TRUE only when you want every table erased at startup.
RESET_MODE: FALSE

# Logs each request and transaction to stdout. Useful while following the
# tutorial; turn it off for anything busy.
TRACE_MODE: TRUE

# ---------------------------------------------------------------------------
# Security
#
# Where certificates and keys live: the issuer configuration the "ca" tool
# defaults to, its key pair, and -- once TLS is finished -- the server's own
# certificate and the CA certificate that says which clients may connect.
#
# Defaults to ZIGURATIP_HOME/etc/cert. Set it to keep the material somewhere
# else, off the install prefix and out of any repository.
# ---------------------------------------------------------------------------

SECURITY:
	#CERTIFICATE_PATH: /path/to/ZiguratIP/home/etc/cert

	# The three files a secure connection needs. A bare name is looked for
	# under CERTIFICATE_PATH; an absolute path is taken as given.
	#
	#   CERTIFICATE  this server's own, issued by the authority below
	#   PRIVATE_KEY  the key that certificate belongs to
	#   AUTHORITY    the certificate that must have signed a client's, so
	#                only the holder of one it issued can connect at all
	#
	# Generate them with the "ca" tool; doc/security.md walks through it.
	# Leave them unset to run in the clear.

	#CERTIFICATE:        server.crt
	#PRIVATE_KEY:        server.key
	#PRIVATE_KEY_CIPHER:
	#AUTHORITY:          authority.crt

	# TRUE keys access on the certificate a connection presents: the subject
	# has to be registered in USERS_PATH, and every table and procedure the
	# request reaches has to be covered by a permission the issuer wrote
	# into that certificate. "ca issue --permission=DEMO" grants a whole
	# schema; "--permission=DEMO::AUTHORS" grants one object; "*" grants
	# everything. A certificate naming none reaches nothing.
	#
	# FALSE, the default, leaves all of that off. A connection is still
	# encrypted and both ends still prove themselves against the AUTHORITY
	# above -- holding a certificate you issued is still the price of
	# admission -- but which certificate it is decides nothing, and the
	# users directory is not consulted. Turn it on deliberately, after
	# registering at least one subject: with nobody registered, every
	# connection is refused.
	#
	# It needs TLS to mean anything. A plain connection presents no
	# certificate, so there is nothing to judge it on and it reaches
	# everything; this only enforces on a port whose TLS_MODE is TRUE, and
	# the server says so at startup when it is not.

	PERMISSIONS_MODE: FALSE

	# Who may connect. One file per subject, named after that subject and
	# holding a certificate it was registered with. A subject with no file
	# here is refused during the handshake, whichever certificate it
	# presents -- so removing the file withdraws access at once, and there
	# is nothing else to undo.
	#
	# What each connection may then reach is not here: it is written into
	# the certificate that opened it, so one subject can hold several
	# certificates granting different things. "ca put", "ca off" and
	# "ca users" manage this directory; doc/security.md explains the rest.
	#
	# Defaults to ZIGURATIP_HOME/etc/users.

	#USERS_PATH: /path/to/ZiguratIP/home/etc/users

# ---------------------------------------------------------------------------
# Storage engine
# ---------------------------------------------------------------------------

MEMORY:
	PAGE_SIZE: 8192     # bytes per page in home/data

TRANSACTION:
	# AUTOCOMMIT commits after every statement. NON-AUTOCOMMIT leaves the
	# boundary to the client; Zeytun commits once per HTTP request either way.
	MODE: NON-AUTOCOMMIT

	# READ-UNCOMMITTED READ-COMMITTED REPEATABLE-READ SNAPSHOT SERIALIZABLE
	ISOLATION_LEVEL: READ-COMMITTED

# ---------------------------------------------------------------------------
# Compiled objects
#
# Parsi sources are compiled to C++ and then to shared objects, so a C++
# compiler has to be on PATH at run time as well as at build time.
# ---------------------------------------------------------------------------

LIBRARY:
	# NONE reloads an object on every use, which is what you want while
	# developing: recompile, restart, see the change. GLOBAL caches per
	# process and LOCAL per thread, both faster, and both mean a recompiled
	# object is ignored until the server restarts.
	CACHE_MODE: NONE

PARSER:
	TRACE_MODE: FALSE
	# Defaults to ZIGURATIP_HOME/etc/patterns.conf.
	#PATTERNS_FILE: /path/to/ZiguratIP/home/etc/patterns.conf

COMPILER:
	# "c++" resolves to the platform compiler everywhere. Replace it only if
	# you need a particular one; the flags must produce a loadable shared
	# object.
	CPP:       c++
	CPP_FLAGS: -Wall -std=c++11 -fPIC
	LD_FLAGS:  -shared

	# All default to the matching directory under ZIGURATIP_HOME.
	#INCLUDE_PATH: /path/to/ZiguratIP/home/include
	#OBJ_PATH:     /path/to/ZiguratIP/home/obj
	#LIB_PATH:     /path/to/ZiguratIP/home/lib
	#TMP_PATH:     /path/to/ZiguratIP/home/tmp
	#LD_PATH:      /path/to/ZiguratIP/home/ld

	# TRUE prints the generated C++ before compiling it.
	TRACE_MODE: FALSE

# ---------------------------------------------------------------------------
# Zigurat: the binary protocol server, for Connector clients
# ---------------------------------------------------------------------------

SERVER:
	TYPE: TCP           # TCP or IPC
	PORT: 2160          # ZIGO on a phone keypad
	BACKLOG: 5          # pending connections
	POOL_SIZE: 5        # worker threads, so concurrent transactions
	BLOCKING_MODE: TRUE
	TIMEOUT: 60         # seconds a socket may sit idle

	# TRUE requires every client to present a certificate the SECURITY
	# authority issued. The server refuses to start if that material is
	# missing, rather than quietly listening in the clear. TCP only.
	TLS_MODE: FALSE

	# Only for TYPE: IPC. The socket is created at this path.
	#PATH: /tmp/ZiguratIP

# ---------------------------------------------------------------------------
# Zeytun: the HTTP server
# ---------------------------------------------------------------------------

HTTP:
	PORT: 2190          # ports below 1024 need root
	BACKLOG: 5
	POOL_SIZE: 5        # worker threads, so concurrent requests
	BLOCKING_MODE: TRUE # keep-alive
	ASYNCHRONOUS_MODE: FALSE
	TIMEOUT: 60         # seconds

	# TRUE requires every client to present a certificate the SECURITY
	# authority issued. Note this is ZiguratIP's own secure channel and not an
	# interoperable TLS, so an ordinary browser cannot speak it -- see
	# doc/security.md.
	TLS_MODE: FALSE

	SESSION_TIMEOUT: 1800   # seconds a session may sit idle before it is dropped

	MAX_URL_LENGTH: 8000
	MAX_HEADERS_LENGTH: 16000
	MAX_CONTENT_LENGTH: 2000000000

	# Defaults to ZIGURATIP_HOME/etc/mime.conf.
	#MIME_FILE: /path/to/ZiguratIP/home/etc/mime.conf
