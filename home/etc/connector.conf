# ---------------------------------------------------------------------------
# Connector configuration
#
# What Connector::open() uses when it is called with no arguments. A program
# that passes a host and a service to open() ignores this file entirely.
#
# Format is the same as ziguratip.conf: "#" starts a comment, and a key that is
# commented out falls back to the default noted beside it.
# ---------------------------------------------------------------------------

HOST: localhost
PORT: 2160          # the Zigurat binary protocol port, /SERVER/PORT server side

TIMEOUT: 60         # seconds a socket may sit idle, 0 waits forever
#BLOCKING_MODE: TRUE

#PATH: /tmp/zigurat  # reserved for an IPC connection

# ---------------------------------------------------------------------------
# Secure connections
#
# TRUE makes the connector open an authenticated, encrypted channel instead of
# a plain one. It has to match the server: /SERVER/TLS_MODE in ziguratip.conf.
#
# Both ends present a certificate and both check the other, so a client needs
# its own certificate and key as well as the authority that must have signed
# the server's. A bare file name is looked for under the certificate directory
# (ZIGURATIP_HOME/etc/cert); an absolute path is taken as given.
#
# The authority named here is the same certificate the server names as its
# AUTHORITY. doc/security.md walks through issuing all of it with the "ca" tool.
#
# What this client may then reach is not configured here. It is written into
# CERTIFICATE, by whoever issued it, and travels with the connection -- so a
# client holding several certificates chooses what it may do by choosing which
# one to present. It has effect only where the server has
# SECURITY/PERMISSIONS_MODE on.
# ---------------------------------------------------------------------------

TLS_MODE: FALSE

#CERTIFICATE:        client.crt
#PRIVATE_KEY:        client.key
#PRIVATE_KEY_CIPHER:
#AUTHORITY:          authority.crt
