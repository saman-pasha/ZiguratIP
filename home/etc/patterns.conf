
TYPE_DEFS:
	{P}NAME:
		SERIE:
			OPTION:
				{$$tmpl}OP: <
					LOOP:
						PROC: TYPE_DEFS
							OP: ,
							OP: >
								BREAK:
		OPTION:
			OP: ::
				PROC: TYPE_DEFS

TYPE_DECL:
	{P}NAME:
		SERIE:
			OPTION:
				{$$tmpl}OP: <
					LOOP:
						{E}NAME:
							OP: ,
							OP: >
								BREAK:
		OPTION:
			OP: ::
				PROC: TYPE_DECL

TUPLE:
	LPAR:
		LOOP:
			RPAR:
				BREAK:
			PROC: EXPR
				OP: ,
				RPAR:
					BREAK:

ATTRIBUTE:
	SERIE:
		{P}NAME:
			SERIE:
				OPTION:
					{$$tmpl}OP: <
						LOOP:
							PROC: TYPE_DEFS
								OP: ,
								OP: >
									BREAK:
			SERIE:
				OPTION:
					{$$args}MACRO: TUPLE
	OPTION:
		{O}OP: \.
			PROC: ATTRIBUTE

OBJECT:
	SERIE:
		{P}NAME:
			SERIE:
				OPTION:
					{$$tmpl}OP: <
						LOOP:
							PROC: TYPE_DEFS
								OP: ,
								OP: >
									BREAK:
			SERIE:
				OPTION:
					{$$args}MACRO: TUPLE
	OPTION:
		{O}OP: \.
			PROC: ATTRIBUTE
		{O}OP: ::
			PROC: OBJECT

OPERAND:
	NAME: BEGIN
		RET: -1
	LPAR:
		PROC: EXPR
			RPAR:
	{P}OP: [+-]|NOT
		PROC: OPERAND
	{E}BOOL:
	{E}INT:
	{E}FLOAT:
	{E}STR:
	{$$obj}PROC: OBJECT
		OPTION:
			{O}OP: \.
				PROC: ATTRIBUTE

OPERATOR:
	OP: ,
		RET: -1
	RPAR:
		RET: -1
	{O}OP: AND|OR
		PROC: OPERAND
			LOOP:
				OP?: [<=>\+-\*/%&\|\^]|==|<=|<>|>=|IS|LIKE|AND|OR
					PROC: OPERATOR
				BREAK:
			RET: 0
	{O}OP: BETWEEN
		PROC: OPERAND
			OP: AND
				PROC: OPERAND
					LOOP:
						OP?: [\+-\*/%&\|\^]
							PROC: OPERATOR
						BREAK:
					RET: 0
	{O}OP: [=<>]|==|<=|<>|>=|IS|LIKE
		PROC: OPERAND
			LOOP:
				OP?: [<=>\+-\*/%&\|\^]|==|<=|<>|>=|IS|LIKE
					PROC: OPERATOR
				BREAK:
			RET: 0
	{O}OP: [\+-]
		PROC: OPERAND
			LOOP:
				OP?: [\+-\*/%&\|\^]
					PROC: OPERATOR
				BREAK:
	{O}OP: [\*/%]
		PROC: OPERAND
			LOOP:
				OP?: [\*/%&\|\^]
					PROC: OPERATOR
				BREAK:
	{O}OP: [&\|\^]
		PROC: OPERAND
			LOOP:
				OP?: [&\|\^]
					PROC: OPERATOR
				BREAK:

EXPR_EXTEND:
	LOOP:
		PROC: OPERATOR
		BREAK:

EXPR:
	PROC: OPERAND
		MACRO: EXPR_EXTEND

ECHO:
	{P}NAME: SELECT
		PROC: SELECT
	LOOP:
		PROC: EXPR
			OP: ,
			OP: ;
				BREAK:
	RET: 0

DECLARE_EXTEND:
	{P}NAME:
		NAME: AS
			PROC: TYPE_DEFS
				OP: ,
				{E}OP: =
					PROC: EXPR
						OP: ,
						OP: ;
							BREAK:
				LPAR:
					LOOP:
						PROC: EXPR
							OP: ,
							RPAR?:
								BREAK:
					RPAR:
						OP: ,
						OP: ;
							BREAK:
				OP: ;
					BREAK:

DECLARE:
	LOOP:
		{P}NAME: GLOBAL
			MACRO: DECLARE_EXTEND
		{P}NAME: SESSION
			NAME: LOCAL
				MACRO: DECLARE_EXTEND
		MACRO: DECLARE_EXTEND

SET:
	SERIE:
		{$$obj}PROC: OBJECT
	OP: =
		PROC: EXPR
			OP: ;

CALL:
	{$$obj}PROC: OBJECT
		OP: ;

RETURN:
	OP: ;
	PROC: EXPR
		OP: ;

IF:
	SERIE:
		PROC: EXPR
	SERIE:
		NAME: BEGIN
			{$BODY}PROC: CLAUSE
				NAME: END
					NAME?: ELSE
					RET: 0
	LOOP:
		{P}NAME: ELSE
			SERIE:
				OPTION:
					NAME: IF
						PROC: EXPR
			NAME: BEGIN
				{$BODY}PROC: CLAUSE
					NAME: END
						NAME?: ELSE
						BREAK:

DO:
	SERIE:
		NAME: BEGIN
			{$BODY}PROC: CLAUSE
				NAME: END
	SERIE:
		NAME: WHILE
			PROC: EXPR
				OP: ;

WHILE:
	SERIE:
		PROC: EXPR
	SERIE:
		NAME: BEGIN
			{$BODY}PROC: CLAUSE
				NAME: END

TRANSACTION:
	{E}NAME: COMMIT
		OP: ;
	{E}NAME: ROLLBACK
		OP: ;
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END
	{P}NAME: ISOLATION
		NAME: LEVEL
			NAME: READ
				{E}NAME: UNCOMMITTED
					OP: ;
				{E}NAME: COMMITTED
					OP: ;
			{E}NAME: REPEATABLE
				NAME: READ
					OP: ;
			{E}NAME: SNAPSHOT
				OP: ;
			{E}NAME: SERIALIZABLE
				OP: ;

TRY:
	SERIE:
		NAME: BEGIN
			{$BODY}PROC: CLAUSE
				NAME: END
	NAME: CATCH
		{E}NAME:
			NAME: AS
				PROC: TYPE_DEFS
					NAME: BEGIN
						{$BODY}PROC: CLAUSE
							NAME: END

THROW:
	{$$obj}PROC: OBJECT
		OP: ;

INSERT:
	SERIE:
		{P}NAME: INTO
			PROC: TYPE_DEFS
				OPTION:
					LPAR:
						LOOP:
							{E}NAME:
								FORWARD: fields
									OP: ,
									RPAR:
										BREAK:
	{P}NAME: VALUES
		LPAR:
			CHECK: fields
				LOOP:
					PROC: EXPR
						BACK: fields
							OP: ,
							RPAR:
								OP: ;
									BREAK:
			LOOP:
				PROC: EXPR
					OP: ,
					RPAR:
						OP: ;
							BREAK:

ORDERBY:
	LOOP:
		PROC: OBJECT
			NAME: ASC
				OP: ,
				OP: ;
					BREAK:
			NAME: DESC
				OP: ,
				OP: ;
					BREAK:
			OP: ,
			OP: ;
				BREAK:

SELECT_ALL_COLUMNS:
	{$$obj}OP?: \*
		{E}OP: \*
			OP: ,
			NAME?: FROM
				BREAK:
	{$$obj}NAME?:
		{E}NAME:
			{O}OP: \.
				{E}OP: \*
					OP: ,
					NAME?: FROM
						BREAK:

SELECT:
	SERIE:
		LOOP:
			{$EXPR}MACRO: SELECT_ALL_COLUMNS
			{$EXPR}PROC: EXPR
				SERIE:
					OPTION:
						NAME: AS
							{E}NAME:
							{E}STR:
				OP: ,
				NAME?: FROM
					BREAK:
	SERIE:
		{P}NAME: FROM
			PROC: TYPE_DEFS
				OPTION:
					{P}NAME: AS
						PROC: TYPE_DEFS
	OP: ;
	SERIE:
		OPTION:
			{P}NAME: WHERE
				PROC: EXPR
	OP: ;
	{P}NAME: ORDER
		NAME: BY
			PROC: ORDERBY

UPDATE:
	SERIE:
		{$FROM}PROC: TYPE_DEFS
			OPTION:
				{P}NAME: AS
					PROC: TYPE_DEFS
	SERIE:
		{P}NAME: SET
			LOOP:
				{P}NAME:
					OP: =
						PROC: EXPR
							OP: ,
							OP: ;
								BREAK:
							NAME?: WHERE
								BREAK:
	{P}NAME: WHERE
		PROC: EXPR
			OP: ;

DELETE:
	SERIE:
		{P}NAME: FROM
			PROC: TYPE_DEFS
				OPTION:
					{P}NAME: AS
						PROC: TYPE_DEFS
	OP: ;
	{P}NAME: WHERE
		PROC: EXPR
			OP: ;

TRUNCATE:
	PROC: TYPE_DEFS
		OP: ;

COLUMN_EXTEND:
	OPTION:
		{E}NAME: NULL
			OPTION:
				{P}NAME: DEFAULT
					PROC: EXPR
		{E}OP: NOT
			NAME: NULL
				OPTION:
					{P}NAME: DEFAULT
						PROC: EXPR
		{P}NAME: DEFAULT
			PROC: EXPR

COLUMN:
	{E}NAME:
		NAME: AS
			PROC: TYPE_DEFS
				OPTION:
					{E}NAME: PRIMARY
						NAME: KEY
							OPTION:
								{P}NAME: DEFAULT
									PROC: EXPR
					{E}NAME: UNIQUE
						NAME: KEY
							MACRO: COLUMN_EXTEND
					{E}NAME: INDEX
						NAME: KEY
							MACRO: COLUMN_EXTEND
					MACRO: COLUMN_EXTEND

TABLE_KEYS:
	NAME: KEY
		{P}NAME:
			LPAR:
				LOOP:
					{E}NAME:
						OP: ,
						RPAR:
							BREAK:
		LPAR:
			LOOP:
				{E}NAME:
					OP: ,
					RPAR:
						BREAK:

TABLE:
	PROC: TYPE_DECL
		SERIE:
			OPTION:
				{P}NAME: REQUIRES
					LOOP:
						PROC: TYPE_DEFS
							OP: ,
							NAME?: BEGIN
								BREAK:
		NAME: BEGIN
			LOOP:
				{P}NAME: COLUMN
					PROC: COLUMN
						OP: ;
				{P}NAME: PRIMARY
					MACRO: TABLE_KEYS
						OP: ;
				{P}NAME: UNIQUE
					MACRO: TABLE_KEYS
						OP: ;
				{P}NAME: INDEX
					MACRO: TABLE_KEYS
						OP: ;
				NAME: END
					BREAK:

PARAMETERS:
	LPAR:
		LOOP:
			RPAR:
				BREAK:
			{P}NAME:
				NAME: AS
					PROC: TYPE_DEFS
						SERIE:
							{$$dir}OPTION:
								{E}NAME: IN
								{E}NAME: OUT
								{E}NAME: INOUT
						OP: ,
						OP: =
							PROC: EXPR
								OP: ,
								RPAR:
									BREAK:
						RPAR:
							BREAK:

PROCEDURE:
	SERIE:
		PROC: TYPE_DECL
			{$PARAMETERS}MACRO: PARAMETERS
	SERIE:
		{P}NAME: RETURNS
			PROC: TYPE_DEFS
	SERIE:
		OPTION:
			{P}NAME: REQUIRES
				LOOP:
					PROC: TYPE_DEFS
						OP: ,
						NAME?: BEGIN
							BREAK:
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END

CONSTRUCTOR:
	SERIE:
		{$PARAMETERS}MACRO: PARAMETERS
	SERIE:
		OPTION:
			{P}NAME: INITIALIZE
				LOOP:
					{$INIT}PROC: TYPE_DEFS
						SERIE:
							MACRO: TUPLE
						OP: ,
						NAME?: BEGIN
							BREAK:
						NAME?: REQUIRES
							BREAK:
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END

FUNCTION_HEAD:
	SERIE:
		PROC: TYPE_DECL
	SERIE:
		{$PARAMETERS}MACRO: PARAMETERS
	{P}NAME: RETURNS
		PROC: TYPE_DEFS

FUNCTION:
	SERIE:
		PROC: FUNCTION_HEAD
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END

VIRTUAL_HEAD:
	SERIE:
		{E}NAME:
			{$PARAMETERS}MACRO: PARAMETERS
	{P}NAME: RETURNS
		PROC: TYPE_DEFS

VIRTUAL:
	SERIE:
		PROC: VIRTUAL_HEAD
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END

DESTRUCTOR:
	SERIE:
		LPAR:
			RPAR:
	NAME: BEGIN
		{$BODY}PROC: CLAUSE
			NAME: END

CLASS:
	SERIE:
		PROC: TYPE_DECL
	SERIE:
		OPTION:
			{P}NAME: BASE
				LOOP:
					PROC: TYPE_DEFS
						OP: ,
						NAME?: BEGIN
							BREAK:
						NAME?: INHERITS
							BREAK:
						NAME?: REQUIRES
							BREAK:
	SERIE:
		OPTION:
			{P}NAME: INHERITS
				LOOP:
					PROC: TYPE_DEFS
						OP: ,
						NAME?: BEGIN
							BREAK:
						NAME?: REQUIRES
							BREAK:
	SERIE:
		OPTION:
			{P}NAME: REQUIRES
				LOOP:
					PROC: TYPE_DEFS
						OP: ,
						NAME?: BEGIN
							BREAK:
	NAME: BEGIN
		LOOP:
			{P}NAME: CONSTRUCTOR
				PROC: CONSTRUCTOR
			{P}NAME: PUBLIC
				OP: :
			{P}NAME: PRIVATE
				OP: :
			{P}NAME: PROTECTED
				OP: :
			{P}NAME: USING
				PROC: TYPE_DEFS
					OP: ;
			{P}NAME: DECLARE
				PROC: DECLARE
			{P}NAME: FUNCTION
				PROC: FUNCTION
			{P}NAME: GLOBAL
				{P}NAME: FUNCTION
					PROC: FUNCTION
			{P}NAME: OVERRIDE
				{P}NAME: VIRTUAL
					{P}NAME: FUNCTION
						PROC: VIRTUAL
				{P}NAME: FUNCTION
					PROC: VIRTUAL
			{P}NAME: OVERRIDE
				{P}NAME: FUNCTION
					PROC: VIRTUAL
			{P}NAME: PURE
				{P}NAME: VIRTUAL
					{P}NAME: FUNCTION
						PROC: VIRTUAL_HEAD
							OP: ;
			{P}NAME: DESTRUCTOR
				PROC: DESTRUCTOR
			NAME: END
				BREAK:

TYPE:
	PROC: TYPE_DECL
		SERIE:
			OPTION:
				{P}NAME: REQUIRES
					LOOP:
						PROC: TYPE_DEFS
							OP: ,
							NAME?: AS
								BREAK:
		NAME: AS
			PROC: TYPE_DEFS
				OP: ;

ENUM:
	PROC: TYPE_DECL
		{$VALUES}NAME: BEGIN
			LOOP:
				{E}NAME:
					OP: ,
					NAME: END
						BREAK:

SEQUENCE:
	PROC: TYPE_DECL
		SERIE:
			OPTION:
				{P}NAME: REQUIRES
					LOOP:
						PROC: TYPE_DEFS
							OP: ,
							NAME?: BEGIN
								BREAK:
		NAME: BEGIN
			SERIE:
				{P}NAME: FROM
					PROC: EXPR
						OP: ;
			SERIE:
				{P}NAME: TO
					PROC: EXPR
						OP: ;
			SERIE:
				{P}NAME: STEP
					PROC: EXPR
						OP: ;
			NAME: END

CLAUSE:
	LOOP:
		{P}NAME: ECHO
			PROC: ECHO
		{P}NAME: DECLARE
			PROC: DECLARE
		{P}NAME: SET
			PROC: SET
		{P}NAME: CALL
			PROC: CALL
		{P}NAME: RETURN
			PROC: RETURN
		{P}NAME: IF
			PROC: IF
		{P}NAME: DO
			PROC: DO
		{P}NAME: WHILE
			PROC: WHILE
		{P}NAME: CONTINUE
			OP: ;
		{P}NAME: BREAK
			OP: ;
		{P}NAME: TRANSACTION
			PROC: TRANSACTION
		{P}NAME: TRY
			PROC: TRY
		{P}NAME: THROW
			PROC: THROW
		{P}NAME: INSERT
			PROC: INSERT
		{P}NAME: SELECT
			PROC: SELECT
		{P}NAME: UPDATE
			PROC: UPDATE
		{P}NAME: DELETE
			PROC: DELETE
		{P}NAME: TRUNCATE
			PROC: TRUNCATE
		NAME?: END
			BREAK:

SUITE:
	LOOP:
		{P}NAME: INCLUDE
			{E}STR:
				OP: ;
		NAME?:
			BREAK:
	LOOP:
		{P}NAME: LINK
			{E}STR:
				OP: ;
		NAME?:
			BREAK:
	LOOP:
		{P}NAME: TABLE
			PROC: TABLE
		{P}NAME: PROCEDURE
			PROC: PROCEDURE
		{P}NAME: CLASS
			PROC: CLASS
		{P}NAME: PAGE
			PROC: CLASS
		{P}NAME: TYPE
			PROC: TYPE
		{P}NAME: ENUM
			PROC: ENUM
		{P}NAME: SEQUENCE
			PROC: SEQUENCE
		EOF:
			BREAK:
