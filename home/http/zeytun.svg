<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 90" width="720" height="90" role="img" aria-label="Zeytun — HTTP server">
  <title>Zeytun</title>
  <desc>An olive branch bearing one fruit, beside the Zeytun wordmark.</desc>

  <defs>
    <linearGradient id="zt-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f9a4e"/>
      <stop offset="1" stop-color="#4d7436"/>
    </linearGradient>
    <linearGradient id="zt-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6f9a4e"/>
      <stop offset="0.55" stop-color="#6f9a4e"/>
      <stop offset="1"    stop-color="#6f9a4e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="90" fill="#ffffff"/>

  <!-- Zeytun is the olive. A branch rather than a tree: this is the part that
       reaches out and hands something over, which is what the server does. -->
  <g>
    <path d="M14 68 C 40 60, 66 46, 96 26"
          fill="none" stroke="#5c7a44" stroke-width="2.6" stroke-linecap="round"/>

    <!-- leaves alternating along the branch, each turned to follow it -->
    <ellipse cx="34" cy="55" rx="12" ry="4.6" fill="url(#zt-leaf)" transform="rotate(-27 34 55)"/>
    <ellipse cx="49" cy="59" rx="11" ry="4.3" fill="url(#zt-leaf)" transform="rotate(19 49 59)"/>
    <ellipse cx="60" cy="42" rx="12" ry="4.6" fill="url(#zt-leaf)" transform="rotate(-31 60 42)"/>
    <ellipse cx="76" cy="45" rx="10.5" ry="4.2" fill="url(#zt-leaf)" transform="rotate(15 76 45)"/>
    <ellipse cx="86" cy="28" rx="11" ry="4.4" fill="url(#zt-leaf)" transform="rotate(-34 86 28)"/>

    <!-- one fruit, because a branch that carries nothing is just a stick -->
    <ellipse cx="45" cy="70" rx="6.2" ry="7.6" fill="#3f5f2e"/>
    <ellipse cx="43.2" cy="67.6" rx="1.9" ry="2.4" fill="#ffffff" opacity="0.34"/>
    <path d="M45 62 C 45 58, 47 56, 50 55" fill="none" stroke="#5c7a44" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <text x="130" y="49"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="35" font-weight="700" letter-spacing="7" fill="#1f2d3d">ZEYTUN</text>

  <text x="133" y="70"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12.5" letter-spacing="2.4" fill="#5b6b7d">HTTP SERVER &#183; PAGES COMPILED, NOT INTERPRETED</text>

  <rect x="130" y="57" width="470" height="2" fill="url(#zt-rule)"/>
</svg>
