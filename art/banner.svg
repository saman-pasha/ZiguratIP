<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <!-- Zigurat, the warrior; one of the three: Cicili writes it, Zigurat
       keeps it, Coco makes it think. Hand-drawn SVG, no external assets. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="0.7" stop-color="#121831"/>
      <stop offset="1" stop-color="#182040"/>
    </linearGradient>
    <radialGradient id="medal" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1d2647"/>
      <stop offset="1" stop-color="#131a35"/>
    </radialGradient>
    <radialGradient id="shieldface" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#b2452f"/>
      <stop offset="1" stop-color="#7e2f22"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#cfd6ef">
    <circle cx="70" cy="52" r="1.6" opacity="0.8"/><circle cx="150" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="215" cy="35" r="1.3" opacity="0.6"/><circle cx="330" cy="70" r="1.0" opacity="0.4"/>
    <circle cx="415" cy="30" r="1.5" opacity="0.7"/><circle cx="470" cy="105" r="1.0" opacity="0.5"/>
    <circle cx="540" cy="48" r="1.2" opacity="0.6"/><circle cx="600" cy="22" r="1.6" opacity="0.8"/>
    <circle cx="705" cy="40" r="1.1" opacity="0.5"/><circle cx="760" cy="90" r="1.4" opacity="0.6"/>
    <circle cx="835" cy="28" r="1.0" opacity="0.5"/><circle cx="905" cy="72" r="1.5" opacity="0.7"/>
    <circle cx="975" cy="38" r="1.1" opacity="0.5"/><circle cx="1060" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="1130" cy="110" r="1.0" opacity="0.4"/><circle cx="1195" cy="42" r="1.6" opacity="0.8"/>
    <circle cx="1245" cy="95" r="1.1" opacity="0.5"/><circle cx="35" cy="150" r="1.0" opacity="0.4"/>
    <circle cx="640" cy="12" r="1.2" opacity="0.6"/>
  </g>

  <!-- the great ziggurat itself, rising behind the medallion -->
  <g fill="#141b38">
    <path d="M420 400 V330 H480 V270 H540 V215 H600 V170 H680 V215 H740 V270 H800 V330 H860 V400 Z"/>
  </g>
  <g fill="#171f42">
    <path d="M455 400 V345 H505 V295 H555 V250 H725 V295 H775 V345 H825 V400 Z"/>
  </g>

  <!-- ziggurat skyline, the family's horizon -->
  <g fill="#0e1327">
    <path d="M0 400 L0 360 H70 V340 H130 V360 H200 V400 Z"/>
    <path d="M170 400 V352 H240 V330 H290 V310 H350 V330 H400 V352 H470 V400 Z"/>
    <path d="M430 400 V366 H500 V344 H560 V366 H630 V400 Z"/>
    <path d="M820 400 V362 H890 V338 H950 V362 H1020 V400 Z"/>
    <path d="M990 400 V354 H1060 V330 H1110 V312 H1170 V330 H1220 V354 H1280 V400 Z"/>
    <path d="M1200 400 V368 H1260 V350 H1280 V400 Z"/>
  </g>
  <rect y="398" width="1280" height="2" fill="#0d1122"/>

  <!-- ================= ZIGURAT, the warrior ================= -->
  <g transform="translate(640,158) scale(1.18) translate(-280,-168)">
    <circle cx="280" cy="168" r="104" fill="#c9873b" opacity="0.10"/>
    <circle cx="280" cy="168" r="95" fill="url(#medal)" stroke="#c9873b" stroke-width="3"/>
    <circle cx="280" cy="168" r="88" fill="none" stroke="#c9873b" stroke-width="1" opacity="0.35"/>
    <g stroke="#9a6a2c" stroke-width="6" stroke-linecap="round">
      <line x1="224" y1="120" x2="338" y2="222"/>
      <line x1="336" y1="120" x2="222" y2="222"/>
    </g>
    <path d="M215 105 L237 113 L222 130 Z" fill="#d8a252"/>
    <path d="M345 105 L323 113 L338 130 Z" fill="#d8a252"/>
    <circle cx="280" cy="170" r="50" fill="url(#shieldface)" stroke="#d8a252" stroke-width="5"/>
    <circle cx="280" cy="170" r="38" fill="none" stroke="#d8a252" stroke-width="1.5" opacity="0.6"/>
    <g fill="#eec784">
      <rect x="253" y="180" width="54" height="9" rx="1.5"/>
      <rect x="264" y="168" width="32" height="9" rx="1.5"/>
      <rect x="271" y="156" width="18" height="9" rx="1.5"/>
      <rect x="277" y="147" width="6" height="6" rx="1"/>
    </g>
  </g>

  <!-- name -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="640" y="323" font-size="32" font-weight="bold" fill="#e8e2d0" letter-spacing="10">ZIGURAT</text>
    <text x="640" y="347" font-size="16" font-style="italic" fill="#9aa2c4">the warrior &#183; what is written is kept</text>
  </g>

  <!-- the one line -->
  <text x="640" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="15"
        font-style="italic" fill="#7d86ad" text-anchor="middle" letter-spacing="1">
    the philosopher writes it &#183; the warrior keeps it &#183; the engineer makes it think
  </text>
</svg>
